# Docker Compose for building from source (dev) — builds the image locally
services:
  nnoel:
    build: .
    ports:
      - "5000:5000"
    environment:
      # Flush Python stdout/stderr immediately (no buffering)
      PYTHONUNBUFFERED: "1"
    volumes:
      - models_data:/app/models:Z        # Persist downloaded models
      - ./data:/app/data:Z               # Persist chat history (SQLite)
      - ./plugins:/app/plugins:Z         # Co-located user plugins (backend + frontend halves)
      # Personal config, mounted over the copy baked into the image so
      # edits apply on ``docker compose restart`` with no rebuild. It
      # must be a FILE on the host — create it first with
      # ``cp config.example.toml config.toml``. If it is missing, Docker
      # bind-mounts a directory over the baked file and the container
      # refuses to start.
      - ./config.toml:/app/config.toml:Z
    restart: unless-stopped

volumes:
  models_data:
