# Docker Compose for building from source (dev) — builds the image locally
services:
  nnoel:
    build: .
    ports:
      - "5000:5000"
    environment:
      # Flush Python stdout/stderr immediately (no buffering)
      PYTHONUNBUFFERED: "1"
    volumes:
      - models_data:/app/models:Z        # Persist downloaded models
      - ./data:/app/data:Z               # Persist chat history (SQLite)
      - ./plugins:/app/plugins:Z         # Co-located user plugins (backend + frontend halves)
      # Single source of truth for config: the host file is mounted over
      # the copy baked into the image, so edits take effect on
      # ``docker compose restart`` with no rebuild. ``config.toml`` is
      # tracked, so this file always exists on the host.
      - ./config.toml:/app/config.toml:Z
    restart: unless-stopped

volumes:
  models_data:
