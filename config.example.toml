# Nnoel server configuration — TEMPLATE shipped with the repo.
#
# Copy it and edit the copy; the real config file is gitignored so your
# personal settings are never committed:
#
#     cp config.example.toml config.toml
#
# ``backend/config.py`` reads exactly ``<repo root>/config.toml`` — that
# one file, no fallback. In Docker the image bakes *this template* in as
# ``/app/config.toml`` (so a fresh clone runs with these defaults), and
# the dev compose file bind-mounts your host ``config.toml`` over it, so
# personal settings apply on ``docker compose restart`` with no rebuild.

[server]
# Network interface and port the FastAPI server binds to
host = "0.0.0.0"
port = 5000

[llama]
url = "http://localhost:11434"
api_key = ""
model_name = "default"

# Speech-to-text (Parakeet TDT 0.6B v3 int8 via sherpa-onnx).
# Set ``enabled = false`` to disable STT entirely (the mic button
# is hidden in the UI). Requires the Silero VAD model file and
# the Parakeet ONNX model directory under ``model_dir``.
[stt]
enabled = true
# Model type: "parakeet" (sherpa-onnx's NeMo Parakeet TDT 0.6B v3 int8).
model_type = "parakeet"
# Path to the STT model directory (relative to project root or absolute).
model_dir = "models/stt/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8"
# Path to the Silero VAD model file (relative to project root or absolute).
vad_model = "models/stt/silero_vad.onnx"
# Default language label.  Falls back to this when [lid] is disabled
# or can't classify the utterance. Parakeet supports 25 languages;
# see the ``language`` notes further down this file.
language = "en"
# --- VAD parameters ---
vad_threshold = 0.5
vad_min_silence_duration = 0.8
vad_min_speech_duration = 0.4
vad_max_speech_duration = 30.0

# Spoken-language identification (Whisper-tiny int8 via sherpa-onnx).
# Auto-detects the language of each transcribed utterance. Disabled
# automatically if the model files are missing.
[lid]
enabled = true
num_threads = 1
model_dir = "models/lid/sherpa-onnx-whisper-tiny"

# Text-to-speech (Piper via sherpa-onnx).
# Set ``enabled = false`` to skip TTS entirely.
[tts]
enabled = true
num_threads = 2
workers = 1
speed = 1.2
pitch = 2.0
model_dir = "models/tts/vits-piper-en_US-amy-medium"
# --- Streaming chunking ---
min_chars = 12
max_chars = 140
adaptive_first_chunk_words = 1

[agent]
name = "Nnoel"
# The system prompt is intentionally short in the default config —
# add your persona, rules, and few-shot examples right here.
system_prompt = """ """

# Websites that should appear as a satellite in the menu. Each
# entry becomes a clickable ball; clicking opens the URL. Add your
# own by uncommenting / extending ``[[websites.entries]]``.
#
# Per-entry fields:
#   id       — required, unique satellite id
#   label    — optional display label (defaults to ``id``)
#   url      — required, the website URL
#   new_tab  — optional bool, default ``false``. When ``true``,
#              clicking the satellite opens the URL in a real
#              browser tab via ``window.open`` and leaves the
#              menu panel closed. When ``false`` (or omitted),
#              the URL is embedded in the menu panel as an iframe.
#              Use ``new_tab = true`` for sites that refuse to be
#              iframed (X-Frame-Options, restrictive CSP, runtime
#              crashes) or that need full browser features.
#   icon     — optional icon shown inside the ball. A bare name
#              (``"home"``, ``"clock"``, ``"globe"``, …) is looked
#              up in the Lucide icon table. A name ending in
#              ``.png`` or ``.svg`` is served from ``/icons/``
#              (the Vite ``public/`` directory). Omit for the
#              default coloured-sphere look. See
#              ``frontend/src/lib/satelliteIcons.ts`` for the
#              curated list of available Lucide icons.
[websites]
# [[websites.entries]]
# id = "github"
# label = "GitHub"
# url = "https://github.com"
# icon = "github"
