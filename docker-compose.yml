# Docker Compose for production — pulls the prebuilt image from GitHub Container Registry
services:
  nnoel:
    image: ghcr.io/desdpy/nnoel-neural-network-on-a-leash:latest
    ports:
      - "5000:5000"
    environment:
      # Flush Python stdout/stderr immediately (no buffering)
      PYTHONUNBUFFERED: "1"
    volumes:
      - models_data:/app/models:Z        # Persist downloaded models
      - ./data:/app/data:Z               # Persist chat history (SQLite)
      # User plugins (backend + frontend halves) are mounted, never
      # baked in. The entrypoint rebuilds the frontend bundle at
      # container start if any ``plugins/*/frontend/index.ts{,x}`` is
      # present, so a new plugin needs a *fresh container*:
      # ``docker compose up -d --force-recreate nnoel`` (a plain
      # ``up`` won't restart an already-running container).
      - ./plugins:/app/plugins:Z
    restart: unless-stopped

volumes:
  models_data:
